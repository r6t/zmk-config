# Enables RGB functionality (Uncomment lines below to enable.)
# CONFIG_ZMK_RGB_UNDERGLOW=y
# CONFIG_WS2812_STRIP=y

# Increase Bluetooth power to prevent missed/repeating/delayed keypresses
CONFIG_BT_CTLR_TX_PWR_PLUS_8=y

# Increase polling rate to 1kHz (zmk default: 125Hz)
CONFIG_USB_HID_POLL_INTERVAL_MS=1

# Power management
# Enable deep sleep (BLE disconnects, near-zero draw)
CONFIG_ZMK_SLEEP=y
# Auto deep sleep after 4 hours of inactivity (use soft-off key for manual off)
CONFIG_ZMK_IDLE_SLEEP_TIMEOUT=10800000
# Enable explicit soft-off behavior (&soft_off in keymap)
CONFIG_ZMK_PM_SOFT_OFF=y
